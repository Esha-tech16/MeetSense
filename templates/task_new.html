{% extends "base.html" %}{% block title %}New task — MeetSense{% endblock %}{% block breadcrumb %}Tasks / New{% endblock %}
{% block content %}<div class="page-heading"><div><div class="eyebrow">A CLEAR NEXT STEP</div><h1>Create a task<span class="heading-period">.</span></h1><p class="page-subtitle">Give an action item an owner and a date to keep it moving.</p></div></div><div class="form-page panel"><form method="post" class="form-stack"><label>Task title<input name="title" required maxlength="240" placeholder="e.g. Share the updated prototype"></label><label>Description <span class="optional">(optional)</span><textarea name="description" rows="3" placeholder="Add a little context..."></textarea></label><label>Team<select name="team_id" id="teamSelect" required>{% for team in teams %}<option value="{{ team.id }}">{{ team.name }}</option>{% endfor %}</select></label><label>Assign to <select name="assigned_to_id" id="assigneeSelect"><option value="">Unassigned</option>{% for team in teams %}{% for member in team.members %}<option value="{{ member.id }}" data-team="{{ team.id }}">{{ member.name }} · {{ team.name }}</option>{% endfor %}{% endfor %}</select></label><label>Due date <span class="optional">(optional)</span><input type="date" name="due_date"></label><div class="form-actions"><a class="button button-quiet" href="{{ url_for('tasks_page') }}">Cancel</a><button class="button button-orange" type="submit">Create task <span>↗</span></button></div></form></div>{% endblock %}
